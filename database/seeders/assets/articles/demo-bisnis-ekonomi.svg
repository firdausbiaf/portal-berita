<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A192F"/>
      <stop offset="1" stop-color="#020C1B"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="300" y1="200" x2="300" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <!-- Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4">
    <line x1="160" y1="180" x2="1040" y2="180"/>
    <line x1="160" y1="260" x2="1040" y2="260"/>
    <line x1="160" y1="340" x2="1040" y2="340"/>
    <line x1="160" y1="420" x2="1040" y2="420"/>
    <line x1="160" y1="500" x2="1040" y2="500"/>
  </g>
  <!-- Area fill under trend -->
  <path d="M 220 460 Q 380 440, 480 380 T 740 310 T 980 190 L 980 500 L 220 500 Z" fill="url(#chartGrad)"/>
  <!-- Bars -->
  <rect x="260" y="420" width="45" height="80" rx="4" fill="#334155"/>
  <rect x="380" y="380" width="45" height="120" rx="4" fill="#334155"/>
  <rect x="500" y="330" width="45" height="170" rx="4" fill="#475569"/>
  <rect x="620" y="300" width="45" height="200" rx="4" fill="#047857"/>
  <rect x="740" y="260" width="45" height="240" rx="4" fill="#059669"/>
  <rect x="860" y="210" width="45" height="290" rx="4" fill="url(#barGrad)"/>
  <!-- Dynamic Trendline -->
  <path d="M 220 460 Q 380 440, 480 380 T 740 310 T 980 190" stroke="#10B981" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Highlight Points -->
  <circle cx="480" cy="380" r="7" fill="#0F172A" stroke="#10B981" stroke-width="3"/>
  <circle cx="740" cy="310" r="7" fill="#0F172A" stroke="#10B981" stroke-width="3"/>
  <circle cx="980" cy="190" r="9" fill="#DC2626" stroke="#FFFFFF" stroke-width="3"/>

  <!-- JatimNusa Badge -->
  <g transform="translate(60, 60)">
    <rect width="100" height="32" rx="16" fill="#059669"/>
    <text x="50" y="20" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">BISNIS</text>
  </g>
</svg>