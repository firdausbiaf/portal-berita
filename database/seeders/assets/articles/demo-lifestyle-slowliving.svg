  <g transform="translate(60, 60)">
    <rect width="115" height="32" rx="16" fill="#D97706"/>
    <text x="57" y="20" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">LIFESTYLE</text>
