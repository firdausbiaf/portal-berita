      <stop stop-color="#FDFBF7"/>
      <stop offset="0.5" stop-color="#F4EFE6"/>
      <stop offset="1" stop-color="#E7DEC8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg6)"/>
  <!-- Minimalist Geometric Earth Shapes -->
  <circle cx="420" cy="380" r="160" fill="#D97706" opacity="0.25"/>
