<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C4A6E"/>
      <stop offset="0.5" stop-color="#0369A1"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="460" x2="0" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#082F49"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg10)"/>
  <!-- Sun on Horizon -->
  <circle cx="600" cy="420" r="80" fill="#FDE047" opacity="0.8"/>
  <rect x="0" y="440" width="1200" height="235" fill="url(#water)"/>

  <!-- Suspension Bridge Silhouette -->
  <!-- Tower 1 -->
  <polygon points="380,180 395,180 405,440 370,440" fill="#DC2626"/>
  <!-- Tower 2 -->
  <polygon points="820,180 835,180 845,440 810,440" fill="#DC2626"/>
  <!-- Cross Bracing -->
  <rect x="375" y="260" width="30" height="8" fill="#B91C1C"/>
  <rect x="373" y="340" width="34" height="8" fill="#B91C1C"/>
  <rect x="815" y="260" width="30" height="8" fill="#B91C1C"/>
  <rect x="813" y="340" width="34" height="8" fill="#B91C1C"/>
  <!-- Main Suspension Cables -->
  <path d="M 100 380 Q 240 240, 387 180 Q 600 380, 827 180 Q 980 260, 1120 400" stroke="#FFFFFF" stroke-width="4" fill="none"/>
  <!-- Bridge Deck -->
  <rect x="60" y="400" width="1080" height="18" fill="#1E293B"/>
  <line x1="60" y1="409" x2="1140" y2="409" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="16 10"/>

  <!-- Category Tag -->
  <g transform="translate(60, 60)">
    <rect width="115" height="32" rx="16" fill="#DC2626"/>
    <text x="57" y="20" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">NASIONAL</text>
  </g>
</svg>