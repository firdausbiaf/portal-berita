<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#042F2E"/>
      <stop offset="0.6" stop-color="#111827"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg9)"/>
  <!-- Green Court in Perspective -->
  <polygon points="320,240 880,240 1060,560 140,560" fill="#065F46" stroke="#FFFFFF" stroke-width="4"/>
  <line x1="600" y1="240" x2="600" y2="560" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="230" y1="400" x2="970" y2="400" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Net -->
  <line x1="280" y1="260" x2="920" y2="260" stroke="#CBD5E1" stroke-width="6"/>

  <!-- Dynamic Flying Shuttlecock -->
  <g transform="translate(560, 150) rotate(25)">
    <!-- Cork -->
    <circle cx="60" cy="100" r="16" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Feathers -->
    <polygon points="60,100 25,30 95,30" fill="#F8FAFC" opacity="0.9" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="45" y1="65" x2="75" y2="65" stroke="#94A3B8" stroke-width="2"/>
    <line x1="38" y1="45" x2="82" y2="45" stroke="#94A3B8" stroke-width="2"/>
  </g>
  <!-- Motion Blur Trail -->
  <path d="M 380 320 Q 480 200, 580 220" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" fill="none"/>

  <!-- Category Tag -->
  <g transform="translate(60, 60)">
    <rect width="120" height="32" rx="16" fill="#DC2626"/>
    <text x="60" y="20" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">OLAHRAGA</text>
  </g>
</svg>