<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#022C22"/>
      <stop offset="0.6" stop-color="#064E3B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="600" y1="100" x2="600" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg7)"/>
  <!-- Sun Rays Radiance -->
  <circle cx="600" cy="180" r="140" fill="url(#sunGlow)" opacity="0.6"/>
  <circle cx="600" cy="180" r="45" fill="#FBBF24"/>
  <!-- Solar Panel Grid in Perspective -->
  <g transform="translate(300, 320)">
    <polygon points="120,40 480,40 580,240 20,240" fill="#0F766E" stroke="#2DD4BF" stroke-width="3"/>
    <!-- Grid Lines -->
    <line x1="210" y1="40" x2="160" y2="240" stroke="#2DD4BF" stroke-width="2"/>
    <line x1="300" y1="40" x2="300" y2="240" stroke="#2DD4BF" stroke-width="2"/>
    <line x1="390" y1="40" x2="440" y2="240" stroke="#2DD4BF" stroke-width="2"/>
    <line x1="95" y1="90" x2="505" y2="90" stroke="#2DD4BF" stroke-width="2"/>
    <line x1="70" y1="140" x2="530" y2="140" stroke="#2DD4BF" stroke-width="2"/>
    <line x1="45" y1="190" x2="555" y2="190" stroke="#2DD4BF" stroke-width="2"/>
  </g>
  <!-- Clean Energy Wave -->
  <path d="M 120 480 Q 360 400, 600 480 T 1080 480" stroke="#10B981" stroke-width="4" fill="none" opacity="0.7"/>

  <!-- Category Tag -->
  <g transform="translate(60, 60)">
    <rect width="130" height="32" rx="16" fill="#0D9488"/>
    <text x="65" y="20" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">TEKNOLOGI</text>
  </g>
</svg>